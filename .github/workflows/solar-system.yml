name: Solar System Workflow



on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
    unit-testing:
        name: Unit Testing
        services: # permet d'avoir un container mongo comme BDD pour les test (on ne plus sur la DB de prod)
          mongo-db:
            image: siddharth67/mongo-db:non-prod # c'est une image deja cuztomisé
            ports:
              - 27017:27017
        env: # definir les identidaint de test pour la DBB mongo de test 
          MONGO_URI: 'mongodb://localhost:27017/superData' # mongodb://mongo-db:27017/superData ou le nom de service place de localhost
          MONGO_USERNAME: non-prod-user
          MONGO_PASSWORD: non-prod-password

        runs-on: ubuntu-latest
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup NodeJS Version - 18
          uses: actions/setup-node@v3
          with:
            node-version: 18
    
        - name: Cache NPM Dependencies
          uses: actions/cache@v3
          with: 
            path: ~/.npm
            key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json')}}
            restore-keys: |
              ${{ runner.os }}-npm-

        - name: Install Dependencies
          run: npm ci

    
        - name: Unit Testing
          id: nodetestunit
          run: npm test
          
        - name: Archive Test Result
          if: always()
          uses: actions/upload-artifact@v6
          with:
            name: Mocha-Test-Result
            path: test-results.xml

    code-coverage:
      needs: unit-testing
      name: code Coverage
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Repo
          uses: actions/checkout@v4

        - name: Setup Node JS
          uses: actions/setup-node@v3
          with:
            node-version: 18

        - name: Cache NPM Dependencies
          uses: actions/cache@v3
          with: 
            path: ~/.npm
            key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json')}}
            restore-keys: |
              ${{ runner.os }}-npm-

        - name: Install Dependency
          run: npm ci

        - name: Check code coverage
          continue-on-error: true
          run: npm run coverage

        - name: Archive Test Result
          uses: actions/upload-artifact@v6
          with:
            name: Code-Coverage-Result
            path: coverage
            retention-days: 5
    Docker:
      needs: code-coverage
      name: Conteneurisation
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Docker login 
          uses: docker/login-action@v3
          with:
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Build and test
          uses: docker/build-push-action@v6
          with: 
            context: .
            push: false
            tags: ${{ vars.DOCKERHUB_USERNAME}}/solar-system:${{ github.sha}}

        - name: Docker image test
          run: |
           docker images
           docker run --name solar -d \
               -p 3000:3000 \
               -e MONGO_URI=$MONGO_URI \
               -e MONGO_USERNAME=$MONGO_USERNAME \
               -e MONGO_PASSWORD=$MONGO_PASSWORD \
               ${{ vars.DOCKERHUB_USERNAME}}/solar-system:${{ github.sha}}

           export IP=$(docker inspect -f '{{ range .NetworkSettings.Networks}}{{ .IPAddress }}{{end}}' solar)

           echo "Container IP: $IP"

           echo "Testing Image URL"
           wget -q -O - http://127.0.0.1:3000/live | grep live

        - name: PUSH
          uses: docker/build-push-action@v6
          with: 
            context: .
            push: true
            tags: ${{ vars.DOCKERHUB_USERNAME}}/solar-system:${{ github.sha}}



    
      
